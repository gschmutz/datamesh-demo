# Redpanda Connect shared RESOURCES, loaded via -r in streams mode:
#   connect -c /connect/connect.yaml -r /connect/resources.yaml streams --bind-http --watcher /connect/streams/*.yaml
#
# Only resource definitions belong here (cache_resources, rate_limit_resources,
# processor_resources, input_resources, output_resources). This file must NOT
# live under the streams watcher directory (everything there is loaded as a
# stream).

cache_resources:
  - label: dedupe_cache
    memory:
      # Roughly bounds how long a seen id+updated_at is remembered, so a user
      # is only re-emitted to Kafka when it actually changes.
      default_ttl: 60s
