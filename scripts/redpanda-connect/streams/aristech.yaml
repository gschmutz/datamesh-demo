# Redpanda Connect STREAM for the Aristech Adapter
#
# Loaded in streams mode, so it may only contain stream-level fields:
# input / buffer / pipeline / output. Top-level config (http/metrics/logger)
# comes from connect.yaml via -o; shared resources from resources.yaml via -r.
#
# Single flow:
#   tickets: http_server (POST /aristech) -> priv.aristech.v1
#
# (Unlike zammad.yaml this adapter has one source and one sink, so it uses a
# direct input/output rather than a broker fan-in + switch fan-out.)
#
# See https://docs.redpanda.com/redpanda-connect/ for all options.

input:
  http_server:
    address: 0.0.0.0:28741
    path: /aristech
    allowed_verbs:
      - POST
  processors:
    # Body arrives as raw bytes; parse to structured JSON.
    - mapping: |
        root = content().parse_json()

output:
  kafka:
    addresses:
      - "${KAFKA_BOOTSTRAP_SERVERS}"
    topic: priv.aristech.v1
