# Shared Redpanda Connect resources, loaded in streams mode via:
#   connect -r /connect/resources.yaml streams --bind-http --watcher /streams/*.yaml
#
# Resource files must NOT live under the /streams directory (everything there is
# loaded as a stream). Hence this is deployed to conf/redpanda-connect/ (one
# level above conf/redpanda-connect/streams/).

cache_resources:
  - label: dedupe_cache
    memory:
      # Roughly bounds how long a seen id+updated_at is remembered, so a user
      # is only re-emitted to Kafka when it actually changes.
      default_ttl: 60s
