# Redpanda Connect STREAM for the Zammad Adapter
#
# This file is loaded in streams mode (`connect streams /streams/*.yaml`), so it
# may only contain stream-level fields: input / buffer / pipeline / output.
# Top-level config (http, metrics, logger) is provided by the container's
# `--bind-http` flag; shared resources (the dedupe cache) live in the resource
# file loaded via `-r` (conf/redpanda-connect/resources.yaml).
#
# Ported from the Vector config (scripts/vector/vector-1.yaml). Vector models a
# DAG of many sources/transforms/sinks; Redpanda Connect runs a single
# input -> pipeline -> output stream, so the two independent Vector flows are
# merged here with a broker INPUT (fan-in, tagging meta `kind`) and a switch
# OUTPUT (fan-out, routing by `kind`).
#
# Flows:
#   tickets:       http_server (POST /ticket)                -> priv.zammad.ticket.v1
#   users:         poll Zammad users/search every 15s        -> priv.zammad.user.v1
#   organizations: poll Zammad organizations/search every 15s -> priv.zammad.organization.v1
#                  (users + organizations deduped by kind+id+updated_at)
#
# See https://docs.redpanda.com/redpanda-connect/ for all options.

input:
  broker:
    inputs:
      # --- tickets: inbound webhook ------------------------------------- #
      - label: zammad_ticket_in
        http_server:
          address: 0.0.0.0:28740
          path: /ticket
          allowed_verbs:
            - POST
        processors:
          # Body arrives as raw bytes; parse to structured JSON (Vector did
          # `. = parse_json!(.message)`).
          - mapping: |
              root = content().parse_json()
              meta kind = "ticket"

      # --- users: scheduled poll of the Zammad search API ----------- #
      - label: zammad_user_in
        # `generate` emits an empty trigger message on an interval; the `http`
        # processor then performs the GET (Vector's scrape_interval_secs: 15).
        generate:
          interval: 15s
          mapping: "root = {}"
        processors:
          - http:
              url: "http://2.58.54.30:28425/api/v1/users/search?query=%28created_at%3A%3Enow-2m%20OR%20updated_at%3A%3Enow-2m&sort_by=id&order_by=asc&per_page=50"
              verb: GET
              timeout: 10s
              headers:
                Accept: application/json
              basic_auth:
                enabled: true
                username: "schmutz68@gmail.com"
                password: "Abc123!Abc123!"
          # The search endpoint returns a JSON array; split into one message
          # per user.
          - unarchive:
              format: json_array
          - mapping: |
              meta kind = "user"

      # --- organizations: scheduled poll of the Zammad search API ------ #
      - label: zammad_organization_in
        generate:
          interval: 15s
          mapping: "root = {}"
        processors:
          - http:
              url: "http://2.58.54.30:28425/api/v1/organizations/search?query=%28created_at%3A%3Enow-2m%20OR%20updated_at%3A%3Enow-2m%29&sort_by=id&order_by=asc&per_page=50"
              verb: GET
              timeout: 10s
              headers:
                Accept: application/json
              basic_auth:
                enabled: true
                username: "schmutz68@gmail.com"
                password: "Abc123!Abc123!"
          # The search endpoint returns a JSON array; split into one message
          # per organization.
          - unarchive:
              format: json_array
          - mapping: |
              meta kind = "organization"

pipeline:
  processors:
    # Dedupe applies to the polled sources (user, organization): re-emit only
    # when id + updated_at changes. Tickets (webhook) are not deduped.
    - switch:
        - check: 'meta("kind") == "user" || meta("kind") == "organization"'
          processors:
            - dedupe:
                cache: dedupe_cache
                key: '${! meta("kind") }-${! json("id") }-${! json("updated_at") }'
                drop_on_err: true

output:
  switch:
    cases:
      - check: 'meta("kind") == "ticket"'
        output:
          kafka:
            addresses:
              - "${KAFKA_BOOTSTRAP_SERVERS}"
            topic: priv.zammad.ticket.v1

      - check: 'meta("kind") == "user"'
        output:
          kafka:
            addresses:
              - "${KAFKA_BOOTSTRAP_SERVERS}"
            topic: priv.zammad.user.v1
            key: '${! json("id") }'

      - check: 'meta("kind") == "organization"'
        output:
          kafka:
            addresses:
              - "${KAFKA_BOOTSTRAP_SERVERS}"
            topic: priv.zammad.organization.v1
            key: '${! json("id") }'
