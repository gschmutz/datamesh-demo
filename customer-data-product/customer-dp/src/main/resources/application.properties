server.port=8083

spring.application.name=datamesh-customer-dp

application.version=@project.version@

# Read-only access to the customer data product (schema customer_dp_v1, filled by Redpanda Connect)
spring.datasource.url=jdbc:postgresql://dataplatform:5432/demodb?currentSchema=customer_dp_v1
spring.datasource.username=demo
spring.datasource.password=abc123!
spring.datasource.hikari.read-only=true
spring.datasource.hikari.auto-commit=false

# the schema is owned by scripts/postgresql/cr_customer-dp_v1.sql, never touched by Hibernate
spring.jpa.hibernate.ddl-auto=none
# keep the session open for the whole request: GraphQL resolves the lazy addresses/phones after the repository call
spring.jpa.open-in-view=true

# GraphQL API (endpoint: /graphql, self-hosted GraphiQL: /graphiql.html)
# the built-in GraphiQL loads from a CDN, use the self-hosted page instead
spring.graphql.graphiql.enabled=false
spring.graphql.schema.printer.enabled=true
spring.graphql.cors.allowed-origin-patterns=*
spring.graphql.cors.allowed-methods=GET,POST,OPTIONS
spring.graphql.cors.allowed-headers=*

# OPA (PII masking policies); fails closed when OPA is unreachable, set opa.enabled=false to disable
opa.enabled=true
opa.url=http://opa:8181
opa.path=/v1/data/datamesh/customer/pii/masked
opa.timeout=2s
